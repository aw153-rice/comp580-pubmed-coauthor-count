_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Count the coauthors on one PubMed paper."
summary: "PubMed Coauthor Paper Count takes a PMID and asks NCBI ESummary how many personal authors that paper lists. Group authors are left out of the count."
highlights:
  - "Takes the PMID of one paper."
  - "Reads the author list from that paper's PubMed summary."
  - "Counts personal authors, and leaves collective names out."
steps:
  - "Give the PMID of the paper."
  - "The plugin fetches that paper's author list from PubMed."
  - "It counts the personal authors and returns that number."
