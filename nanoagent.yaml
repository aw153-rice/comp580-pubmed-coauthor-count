_ > nanoagent.plugin.v0001.ManifestConfig:
id: pubmed-coauthor-paper-count
name: PubMed Coauthor Paper Count
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: [eutils.ncbi.nlm.nih.gov]
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  count_coauthor_papers:
    description: Count the other PubMed papers that match at least one author on the source paper.
  pin_coauthor_count:
    description: Pin that same other-paper count before the task runs, as the answer key.

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  pubmed-coauthor-paper-count:
    description: Return how many other PubMed papers the coauthors of one paper have.
    runner: tool
    tools: [count_coauthor_papers]
    reference: pin_coauthor_count
    instructions: Call count_coauthor_papers once with the PMID and the author list, and return that tool's other_papers unchanged.
